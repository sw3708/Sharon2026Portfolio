<script>
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);

// Frames are preloaded and decoded up front, so scrubbing never waits on a video seek.

// slope into the existing pacing. Raise START_GAIN for a lighter opening.

}

// Scroll pacing, measured in screen-heights of scrolling ("screens").
